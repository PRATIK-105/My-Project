<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptSave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0e0e11;
    --bg2:      #18181b;
    --bg3:      #1f1f24;
    --border:   #2e2e35;
    --border2:  #3a3a45;
    --text:     #e4e4e7;
    --muted:    #71717a;
    --accent:   #a3e635;
    --accent2:  #84cc16;
    --danger:   #f87171;
    --purple:   #a78bfa;
    --blue:     #60a5fa;
    --amber:    #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 380px;
    min-height: 520px;
    max-height: 600px;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg { width: 16px; height: 16px; }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .logo-text span { color: var(--accent); }

  .header-actions { display: flex; gap: 6px; }

  .icon-btn {
    width: 30px; height: 30px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* ── Search ── */
  .search-wrap {
    padding: 10px 16px 8px;
    flex-shrink: 0;
  }

  .search-box {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-box svg {
    position: absolute;
    left: 10px;
    width: 14px; height: 14px;
    color: var(--muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 10px 8px 32px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  /* ── Category tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 16px 10px;
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--border2); color: var(--text); }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 500;
  }

  /* ── Prompt list ── */
  .list-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--muted);
    gap: 8px;
    text-align: center;
  }
  .empty-state svg { width: 32px; height: 32px; opacity: 0.4; }
  .empty-state p { font-size: 12px; line-height: 1.6; }

  .prompt-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .prompt-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .prompt-card:hover {
    border-color: var(--border2);
    background: var(--bg3);
  }
  .prompt-card:hover::before { opacity: 1; }
  .prompt-card.pinned::before { opacity: 1; background: var(--amber); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }

  .card-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .prompt-card:hover .card-actions { opacity: 1; }

  .card-btn {
    width: 24px; height: 24px;
    border-radius: 5px;
    border: none;
    background: var(--bg);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.12s;
  }
  .card-btn:hover { background: var(--border2); color: var(--text); }
  .card-btn.danger:hover { background: #7f1d1d; color: var(--danger); }
  .card-btn.pin-active { color: var(--amber); }
  .card-btn svg { width: 12px; height: 12px; }

  .card-preview {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .cat-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    border: 1px solid;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .use-count {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  /* Category colors */
  .cat-coding    { color: var(--blue);   border-color: #1e3a5f; background: #0c1f35; }
  .cat-writing   { color: var(--purple); border-color: #3b1f6b; background: #1a0e35; }
  .cat-learning  { color: var(--accent); border-color: #2d4a0a; background: #111f04; }
  .cat-productivity { color: var(--amber); border-color: #6b4c0a; background: #2a1e04; }
  .cat-other     { color: var(--muted);  border-color: var(--border); background: var(--bg); }

  /* ── Add/Edit form ── */
  .form-overlay {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 10;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    display: none;
  }
  .form-overlay.show { display: flex; }

  .form-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .form-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
  }

  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .form-input, .form-textarea, .form-select {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
  .form-textarea { resize: none; height: 120px; line-height: 1.6; }
  .form-select { cursor: pointer; }
  .form-select option { background: var(--bg2); }

  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }

  .btn-primary {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    width: 100%;
  }
  .btn-primary:hover { background: var(--accent2); }

  /* ── Platform badge (bottom) ── */
  .platform-bar {
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .platform-info {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .platform-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .platform-dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .count-badge {
    font-size: 10px;
    color: var(--muted);
  }

  /* Highlight for search */
  mark {
    background: transparent;
    color: var(--accent);
    font-weight: 500;
  }

  /* Scrollbar */
  .list-wrap::-webkit-scrollbar { width: 4px; }
  .list-wrap::-webkit-scrollbar-track { background: transparent; }
  .list-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="5" height="5" rx="1" fill="#000"/>
        <rect x="9" y="2" width="5" height="5" rx="1" fill="#000"/>
        <rect x="2" y="9" width="5" height="5" rx="1" fill="#000"/>
        <rect x="9" y="11" width="5" height="2" rx="1" fill="#000"/>
        <rect x="12" y="9" width="2" height="5" rx="1" fill="#000"/>
      </svg>
    </div>
    <span class="logo-text">Prompt<span>Save</span></span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="importBtn" title="Import prompts">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 2v8M5 7l3 3 3-3M2 12h12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="icon-btn" id="exportBtn" title="Export prompts">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 10V2M5 5l3-3 3 3M2 12h12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="icon-btn" id="addBtn" title="New prompt" style="background:var(--accent); color:#000; border-color:var(--accent)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3v10M3 8h10" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<!-- ── Search ── -->
<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="6.5" cy="6.5" r="4"/>
      <path d="M10 10l3 3" stroke-linecap="round"/>
    </svg>
    <input class="search-input" id="searchInput" placeholder="Search prompts..." autocomplete="off" spellcheck="false">
  </div>
</div>

<!-- ── Category tabs ── -->
<div class="tabs" id="tabsRow">
  <button class="tab active" data-cat="all">All</button>
  <button class="tab" data-cat="coding">Coding</button>
  <button class="tab" data-cat="writing">Writing</button>
  <button class="tab" data-cat="learning">Learning</button>
  <button class="tab" data-cat="productivity">Productivity</button>
  <button class="tab" data-cat="other">Other</button>
</div>

<!-- ── Prompt list ── -->
<div class="list-wrap" id="listWrap">
  <!-- filled by JS -->
</div>

<!-- ── Platform bar ── -->
<div class="platform-bar">
  <div class="platform-info">
    <div class="platform-dot" id="platformDot"></div>
    <span id="platformName">Not on an AI site</span>
  </div>
  <span class="count-badge" id="countBadge">0 prompts</span>
</div>

<!-- ── Add / Edit form overlay ── -->
<div class="form-overlay" id="formOverlay">
  <div class="form-header">
    <span class="form-title" id="formTitle">New Prompt</span>
    <button class="icon-btn" id="closeFormBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="form-group">
    <label class="form-label">Title</label>
    <input class="form-input" id="formTitleInput" placeholder="e.g. Fix my code" maxlength="60" spellcheck="false">
  </div>

  <div class="form-group">
    <label class="form-label">Prompt text</label>
    <textarea class="form-textarea" id="formTextInput" placeholder="Write your prompt here..."></textarea>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select" id="formCatInput">
        <option value="coding">Coding</option>
        <option value="writing">Writing</option>
        <option value="learning">Learning</option>
        <option value="productivity">Productivity</option>
        <option value="other">Other</option>
      </select>
    </div>
  </div>

  <button class="btn-primary" id="saveFormBtn">Save Prompt</button>
  <input type="hidden" id="editingId">
</div>

<script src="popup.js"></script>
</body>
</html>
